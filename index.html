                {

                {

                {

                {

                        { name: "Yellow", value: "#C49B03" },

                },
                {

                {

                {
                    code: "E005",
                    price: 50,

                    colors: [{ name: "Yellow", value: "#C49B03" }],
                },
                {
                    code: "E004",
                    price: 110,
                    thumbnail: "src/assets/earings/E004/e004_th.png",
                    colors: [{ name: "Dusty Pink", value: "#CC888F" }],
                },
                {
                    code: "E003",
                    price: 195,
                    thumbnail: "src/assets/earings/E003/e003_th.png",
                    colors: [{ name: "Berry Red", value: "#B2404F" }],
                },
                {
                    code: "E002",
                    price: 50,
                    thumbnail: "src/assets/earings/E002/e002_th.png",
                    colors: [{ name: "Silver", value: "#C0C0C0" }],
                },
                {
                    code: "E001",
                    price: 65,
                    thumbnail: "src/assets/earings/E001/e001_th.png",
                    colors: [{ name: "Silver", value: "#C0C0C0" }],
                },
            ];

            const productContainer =
                document.getElementById("productContainer");

            for (let i = 0; i < earRingItems.length; i++) {
                const item = earRingItems[i];

                const card = `
                    <div class="col mb-4">
                        <div class="card h-100">

                            <!-- Product image -->
                            <img
                              id="product-image-${item.code}"
                                class="card-img-top"
                                style="height: 280px !important; object-fit: cover !important; object-position: center !important; display: block !important;"
                                src="${item.thumbnail}"
                                alt="${item.code}"
                            />



                              <div class="d-flex justify-content-end gap-1 mb-0 mt-1">
                                  ${item.colors
                                      .map(
                                          (color) => `
                                    <div
                                      title="${color.name}"
                                      style="
                                        width: 18px;
                                        height: 18px;
                                        border-radius: 50%;
                                        background-color: ${color.value};
                                        border: 2px solid #fff;
                                        box-shadow: 0 0 0 1px #ccc;
                                        cursor: pointer;
                                        transition: transform .15s ease, box-shadow .15s ease;
                                      "
                                      onclick="
                                              document.getElementById(
                                                  'product-image-${item.code}'
                                              ).src = '${color.thumbnail || item.thumbnail}';
                                          "
                                      onmouseover="this.style.transform='scale(1.2)'; this.style.boxShadow='0 0 0 1px #212529'"
                                      onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 0 0 1px #ccc'"
                                    ></div>
                                  `,
                                      )
                                      .join("")}
                                </div>

                                <div class="text-center mb-3">

                                    <!-- Product name -->
                                    <h5 class="fw-bolder">
                                        ${item.code}
                                    </h5>

                                    <!-- Product price -->
                                    Rs. ${item.price}

                                </div>

                            <!-- Product actions 
                            <div
                                class="card-footer p-4 pt-0 border-top-0 bg-transparent"
                            >
                                <div class="text-center">
                                    <a
                                        class="btn btn-outline-dark mt-auto"
                                        href="#"
                                    >
                                        Explore
                                    </a>
                                </div>
                            </div>
                            -->

                        </div>
                    </div>
                            </div>

                `;

                productContainer.innerHTML += card;
            }
